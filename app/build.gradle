plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kai.ccpanion'
    compileSdk 35

    defaultConfig {
        applicationId "com.kai.ccpanion"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        cc {
            storeFile file('../ccpanion.keystore')
            storePassword 'ccpanion1'
            keyAlias 'cc'
            keyPassword 'ccpanion1'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.cc
        }
        release {
            signingConfig signingConfigs.cc
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
